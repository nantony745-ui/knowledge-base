name: ${COMPOSE_PROJECT_NAME:-knowledge-base}
services:
  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
    - 127.0.0.1:6380:6379
    volumes:
    - redis_data:/data
    networks:
    - kb-network
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kb
      MYSQL_USER: kb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
    - 127.0.0.1:3316:3306
    volumes:
    - mysql_data:/var/lib/mysql
    networks:
    - kb-network
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -p${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 60
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
    - milvus_etcd_data:/etcd
    networks:
    - kb-network
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowledgebase}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/gen-secrets.sh}
    command: minio server /minio_data --console-address ":9001"
    volumes:
    - milvus_minio_data:/minio_data
    networks:
    - kb-network
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 20s
      retries: 3
  milvus:
    image: milvusdb/milvus:v2.6.22
    command:
    - milvus
    - run
    - standalone
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-knowledgebase}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/gen-secrets.sh}
    volumes:
    - milvus_data:/var/lib/milvus
    ports:
    - 127.0.0.1:19540:19530
    - 127.0.0.1:9093:9091
    networks:
    - kb-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
volumes:
  redis_data: null
  mysql_data: null
  milvus_etcd_data: null
  milvus_minio_data: null
  milvus_data: null
networks:
  kb-network: {}
