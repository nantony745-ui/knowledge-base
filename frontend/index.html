  <section id="login-view" class="login-view"><form id="login-form"><h1>Knowledge Base</h1><p>管理员登录</p><label class="form-field"><span>用户名</span><input name="username" autocomplete="username" required></label><label class="form-field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="form-error" role="status"></p><button type="submit" class="button primary">登录</button></form></section>
  <div class="app-shell" hidden>
    <aside class="side-panel" aria-label="对话与知识库导航">
      <div class="side-panel-head">
        <span class="panel-brand"><span class="panel-brand-mark">K</span>Knowledge Base</span>
        <button class="panel-collapse" data-action="collapse" aria-label="收起或展开侧栏" aria-pressed="false"><svg><use href="#i-panel"/></svg></button>
      </div>
      <div class="primary-actions">
        <button class="primary-action" data-action="new-chat"><svg><use href="#i-chat"/></svg><span>新对话</span></button>
        <button class="primary-action" data-action="open-knowledge"><svg><use href="#i-book"/></svg><span>知识库</span></button>
        <a class="primary-action" href="/toolbox"><svg><use href="#i-modules"/></svg><span>Skills 与 MCP</span></a>
        <a class="primary-action" href="/settings"><svg><use href="#i-settings"/></svg><span>设置</span></a>
      </div>
      <div class="history" id="history-panel">
        <div class="history-label">历史对话<span class="count" id="history-count"></span></div>
        <div class="history-list" id="history-list"></div>
      </div>
      <div class="account-panel"><span id="user-status"></span><button class="button" data-action="logout">退出登录</button></div>
    </aside>
    <button class="panel-toggle" data-action="collapse" aria-label="展开侧栏"><svg><use href="#i-panel"/></svg></button>

    <main class="workspace" id="workspace">
      <div class="ambient-background" aria-hidden="true">
        <svg viewBox="0 0 1000 720" preserveAspectRatio="none"><defs><linearGradient id="wave-one" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceeff" stop-opacity=".08"/><stop offset="1" stop-color="#b9d9ff" stop-opacity=".30"/></linearGradient><linearGradient id="wave-two" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#e5f5ff" stop-opacity=".08"/><stop offset="1" stop-color="#b4d5ff" stop-opacity=".20"/></linearGradient><linearGradient id="wave-three" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2eaff" stop-opacity=".12"/><stop offset="1" stop-color="#aed0ff" stop-opacity=".22"/></linearGradient></defs><path fill="url(#wave-one)" d="M0 517C109 383 217 453 351 507S597 608 755 469 877 219 1000 162V720H0Z"/><path fill="url(#wave-two)" d="M0 708C192 653 274 589 459 562S751 576 853 412 927 322 1000 298V720H0Z"/><path fill="url(#wave-three)" d="M0 720C179 744 321 656 468 611S741 485 1000 435V720Z"/></svg>
      </div>
      <header class="window-bar">
        <button class="notification-button" data-action="notifications" aria-label="通知"><svg><use href="#i-bell"/></svg><i></i></button>
        <button data-action="logout" aria-label="退出登录">退出登录</button><span class="window-separator"></span>
        <button data-action="fullscreen" aria-label="进入或退出全屏"><svg><use href="#i-maximize"/></svg></button>
        <button data-action="new-chat" aria-label="关闭当前视图并开始新对话"><svg><use href="#i-close"/></svg></button>
      </header>
      <section class="home-view" id="home-view" aria-label="新对话">
        <h1><span>Knowledge</span> Base</h1>
        <form class="chat-composer" id="home-search-form">
          <textarea id="home-search" name="q" rows="2" aria-label="输入问题" placeholder="输入问题或描述任务…"></textarea>
          <div class="composer-footer">
            <div class="chat-options"><select class="chat-mode-select" data-chat-mode aria-label="对话模式"><option value="quick_answer">快速问答</option><option value="smart_reasoning" selected>智能推理</option><option value="plain_chat">普通对话</option></select><details class="chat-scope-picker" data-chat-scope><summary>知识库</summary></details></div>
            <span class="chat-model" data-chat-model>正在加载…</span>
            <button class="chat-send" type="submit" aria-label="发送消息" title="发送消息"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
          </div>
        </form>
      </section>
      <section class="content-view" id="content-view" hidden></section>
    </main>
  </div>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-heading">
    <h2 id="search-heading" class="sr-only">全局搜索</h2>
    <div class="command-search"><svg><use href="#i-search"/></svg><input id="command-input" type="search" placeholder="搜索知识库或文档名称..." aria-label="全局搜索关键词" autocomplete="off"><button data-action="close-dialog" aria-label="关闭搜索"><kbd>Esc</kbd></button></div>
    <div class="search-filters" role="group" aria-label="搜索类型"><button data-filter="all" class="active" aria-pressed="true">全部</button><button data-filter="library" aria-pressed="false">知识库</button><button data-filter="file" aria-pressed="false">文档</button></div>
    <div class="search-results" id="search-results"></div>
    <div class="command-footer"><span>当前已加载知识库与文档名称</span><span><kbd>↑</kbd><kbd>↓</kbd>选择 <kbd>Enter</kbd>打开</span></div>
  </dialog>
  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="editor-heading"></dialog>
  <dialog id="general-dialog" class="general-dialog" aria-labelledby="general-heading"></dialog>
  <dialog id="source-dialog" class="source-dialog" aria-labelledby="source-name"><button class="button" data-action="close-dialog">关闭</button><h2 id="source-name"></h2><p id="source-meta" class="source-meta"></p><pre id="source-text"></pre><a id="source-download">下载原文件</a></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
